# Профиль для локального запуска БЕЗ MySQL и Docker.
# Запуск:  ./gradlew bootRun --args='--spring.profiles.active=local'
# Использует встроенную базу H2 в памяти (данные живут, пока работает приложение).

spring.datasource.url=jdbc:h2:mem:polygons;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Консоль H2 (необязательно): http://localhost:8080/h2-console
spring.h2.console.enabled=true
